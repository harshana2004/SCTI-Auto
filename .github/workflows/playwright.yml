
name: SCTI Playwright CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build and install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Playwright test discovery
        run: npx playwright test --list

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Clear previous test results
        run: rm -rf allure-results allure-report test-results

  smoke:
    name: Smoke tests - 3 browsers
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        run: |
          npm run test:smoke -- \
            --project=chromium \
            --project=firefox \
            --project=webkit

  regression:
    name: Regression tests - 3 browsers
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Run regression tests
        run: |
          npm run test:regression -- \
            --project=chromium \
            --project=firefox \
            --project=webkit

  responsive-regression:
    name: Responsive regression tests
    needs: regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run responsive regression tests
        run: npm run test:responsive -- --project=chromium

  report:
    name: Publish test artifacts
    needs: [smoke, regression, responsive-regression]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download available test artifacts
        run: echo "Configure artifact downloads when test jobs upload their results."
